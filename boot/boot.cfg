# Bootloader configuration for the DPU. The bootloader (e.g. U-Boot) reads this
# to find the kernel, the device tree, and the verification keys.
kernel       = /boot/Image           # the ARM Linux kernel image
devicetree   = /boot/dpu.dtb         # compiled device tree blob
bootargs     = console=ttyAMA0 root=/dev/mmcblk0p2 ro

# Secure boot: every stage must be signed; the bootloader refuses unsigned images.
secure_boot  = enforce
kernel_key   = /keys/dpu_kernel.pub  # public key to verify the kernel signature
